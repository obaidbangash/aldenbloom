# Same cPanel / same FTP secrets. Set FTP_REMOTE_DIR to your web root (e.g. public_html).
# 1) Repo root (minus bloomalden.com/) → public_html/
# 2) Repo folder bloomalden.com/          → public_html/bloomalden.com/
name: Deploy to GoDaddy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to public_html (main site)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/
          timeout: 120000
          exclude: |
            .git/**
            .github/**
            .claude/**
            bloomalden.com/**
            .well-known/**
            .DS_Store
            .env
            .env.*
            *.md

      - name: Deploy to public_html/bloomalden.com (Bloomalden)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: bloomalden.com/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/bloomalden.com/
          state-name: .ftp-deploy-sync-state.json
          timeout: 120000
          exclude: |
            .git/**
            .github/**
            .claude/**
            .well-known/**
            .DS_Store
            .env
            .env.*
            *.md
            error_log
