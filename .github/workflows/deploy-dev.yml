# Same layout as production, using *_DEV secrets (often same host; different path if you use staging).
# FTP_REMOTE_DIR_DEV ≈ public_html for your dev/staging account path.
name: Deploy to GoDaddy (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to public_html (main site, dev)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR_DEV }}/
          timeout: 120000
          exclude: |
            .git/**
            .github/**
            .claude/**
            bloomalden.com/**
            .well-known/**
            .DS_Store
            .env
            .env.*
            *.md

      - name: Deploy to public_html/bloomalden.com (Bloomalden, dev)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          local-dir: bloomalden.com/
          server-dir: ${{ secrets.FTP_REMOTE_DIR_DEV }}/bloomalden.com/
          state-name: .ftp-deploy-sync-state.json
          timeout: 120000
          exclude: |
            .git/**
            .github/**
            .claude/**
            .well-known/**
            .DS_Store
            .env
            .env.*
            *.md
            error_log
