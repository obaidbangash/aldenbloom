# Deploy when pushing or merging into dev (staging)
# - Main site: repo root → FTP_REMOTE_DIR_DEV
# - Bloomalden: repo folder bloomalden.com/ → FTP_REMOTE_DIR_BLOOMALDEN_DEV (only here; not on main)
name: Deploy to GoDaddy (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy main site (repo root, dev)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR_DEV }}
          timeout: 120000
          exclude: |
            .git/**
            .github/**
            .claude/**
            bloomalden.com/**
            .DS_Store
            .env
            .env.*
            *.md

  deploy-bloomalden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy bloomalden.com (addon folder, dev)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          local-dir: bloomalden.com/
          server-dir: ${{ secrets.FTP_REMOTE_DIR_BLOOMALDEN_DEV }}/
          state-name: bloomalden.com/.ftp-deploy-sync-state.json
          timeout: 120000
          exclude: |
            .git/**
            .github/**
            .claude/**
            .DS_Store
            .env
            .env.*
            *.md
            error_log
