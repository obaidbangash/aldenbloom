# Deploy when pushing or merging into dev.
# Same FTP account: web root is FTP_REMOTE_DIR_DEV (e.g. public_html/).
# Bloomalden addon files go to web root + bloomalden.com/ (e.g. public_html/bloomalden.com/).
name: Deploy to GoDaddy (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy main site (repo root, dev)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR_DEV }}/
          timeout: 120000
          exclude: |
            .git/**
            .github/**
            .claude/**
            bloomalden.com/**
            .DS_Store
            .env
            .env.*
            *.md

  deploy-bloomalden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy bloomalden.com folder (inside same public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          local-dir: bloomalden.com/
          server-dir: ${{ secrets.FTP_REMOTE_DIR_DEV }}/bloomalden.com/
          state-name: .ftp-deploy-sync-state.json
          timeout: 120000
          exclude: |
            .git/**
            .github/**
            .claude/**
            .DS_Store
            .env
            .env.*
            *.md
            error_log
